name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Verify release candidate
        run: ./scripts/verify.sh

# Production deployment is owned by OpenAI Sites. This workflow deliberately
# performs no GitHub Pages deployment and never exposes TMDB credentials.
